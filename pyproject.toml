[project]
name = "opentasks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "PySide6==6.10.1",
  "django-environ==0.12.0",
  "dataclasses-json==0.6.7",
  "things-py>=0.0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["opentasks"]
